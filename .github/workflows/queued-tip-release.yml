name: QMDB queued-tip release

on:
  push:
    branches: [iverc/qmdb-queued-tip-release]

permissions:
  contents: read

concurrency:
  group: qmdb-queued-tip-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      NIGHTLY_VERSION: nightly-2026-06-21
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f7ccc83f9ed1e5b9c81d8a67d7ad1a747e22a561
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: commonware-focused-storage
          cache-on-failure: 'false'
      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: just@1.43.0,cargo-nextest@0.9.133
      - name: Check formatting
        run: |
          rustup toolchain install "$NIGHTLY_VERSION" --profile minimal --component rustfmt
          just check-fmt
      - name: Reproduce the retained queued-tip stall
        run: python3 .github/scripts/check-queued-tip-baseline.py
      - name: Check target release and finish precedence
        run: just test --locked -p commonware-storage -E 'test(qmdb::sync::engine::tests::)'
      - name: Check tuple generation coordination
        run: just test --locked -p commonware-glue -E 'test(tuple_state_sync)'
      - name: Check storage lints
        run: just clippy -p commonware-storage
      - name: Check storage without std
        run: cargo check --locked -p commonware-storage --no-default-features
      - name: Check storage on WASM
        run: cargo check --locked -p commonware-storage --target wasm32-unknown-unknown
