name: Vera upstream refresh

on:
  push:
    branches: [iverc/vera-upstream-refresh-20261015]

permissions:
  contents: read

concurrency:
  group: vera-upstream-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f7ccc83f9ed1e5b9c81d8a67d7ad1a747e22a561
        with:
          toolchain: 1.98.0
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: commonware-focused-storage
          cache-on-failure: 'true'
      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: cargo-nextest@0.9.133
      - name: Verify archive and sync corrections
        run: >-
          cargo nextest run --locked -p commonware-storage -p commonware-glue
          --ignore-default-filter
          -E 'test(index::) | test(archive::prunable::tests::) | test(stateful::db::tests::) | test(qmdb::sync::engine::tests::) | test(state_sync_drains_queued_target_before_reporting_reached)'
      - name: Lint affected crates and tests
        run: cargo clippy --locked -p commonware-storage -p commonware-glue --all-targets -- -D warnings
      - name: Check storage without default features
        run: cargo check --locked -p commonware-storage --no-default-features
      - name: Check storage on WebAssembly
        run: cargo check --locked -p commonware-storage --target wasm32-unknown-unknown
